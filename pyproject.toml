[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "restricted-decision-trees"
version = "0.3.0"
description = "Native C++ implementation of Restricted Decision Trees (RDT), with Random Forest and Gradient Boosting ensembles"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Amrit Nath Mishra" },
]
keywords = ["decision-tree", "machine-learning", "interpretable-ml", "staged-decision-systems"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.19"]

[project.urls]
Homepage = "https://github.com/amritnm/restricted-decision-trees"
Repository = "https://github.com/amritnm/restricted-decision-trees"

[tool.scikit-build]
wheel.packages = ["python/rdt"]
build.verbose = true
logging.level = "INFO"

[tool.pytest.ini_options]
markers = [
    "slow: long-running shape/scenario grids (deselected by default; run with -m slow)",
]
addopts = "-m 'not slow'"
