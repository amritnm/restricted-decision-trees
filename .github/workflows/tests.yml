name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch / PR supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Caps OpenMP/BLAS threads (xgboost, numpy, scikit-learn). The library's own
  # pool ignores it: n_jobs=-1 resolves to std::thread::hardware_concurrency().
  OMP_NUM_THREADS: "2"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}${{ matrix.slow && ' (+slow)' || '' }}
    runs-on: ${{ matrix.os }}
    # Measured: ~1.5-2.5 min per job (build ~30 s, default suite ~35-55 s, slow ~40 s).
    timeout-minutes: ${{ matrix.slow && 30 || 20 }}
    defaults:
      run:
        shell: bash  # also on Windows (Git Bash), so every step reads the same
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
            slow: true
          - os: macos-latest
            python: "3.12"
          # aarch64 Linux: GCC with FMA available (see CMakeLists.txt).
          - os: ubuntu-24.04-arm
            python: "3.12"
          # MSVC: the release wheels include win_amd64.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and install from source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v .

      - name: Install libomp (macOS)
        # The macOS xgboost wheels link against Homebrew's libomp.dylib, which
        # the runner image does not ship.
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install test dependencies
        # xgboost >= 3.4 (needed by the parity tests) requires Python >= 3.12;
        # on older Pythons those tests skip via importorskip(minversion=...).
        # psutil: the memory tests read the peak working set with it on Windows.
        run: |
          python -m pip install pytest numpy scikit-learn "xgboost>=3.4; python_version >= '3.12'" \
            "psutil; sys_platform == 'win32'"
          python -m pip list
          python -c "import rdt, sys; print(rdt.__file__, sys.version)"

      - name: Check xgboost loads
        # Fail here rather than let the parity tests error at collection.
        if: matrix.python != '3.10'
        run: python -c "import xgboost; print('xgboost', xgboost.__version__)"

      - name: Run tests
        run: python -m pytest tests -ra --durations=15

      - name: Run slow tests
        if: matrix.slow
        run: python -m pytest tests -m slow -ra --durations=15

  wheel-smoke-windows:
    # Builds one Windows wheel the way pypi-publish.yml does (same cibuildwheel
    # pin and build options), installs it in a clean environment and runs a few
    # tests against it. Nothing is uploaded or published.
    name: cibuildwheel smoke (windows, cp312)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build and test a wheel (not published)
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: "cp312-win_amd64"
          # Keep in sync with pypi-publish.yml (see the comments there).
          CIBW_BUILD_FRONTEND: pip
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_REQUIRES: pytest numpy scikit-learn
          CIBW_TEST_COMMAND: pytest {project}/tests/test_rdt.py {project}/tests/test_ensemble.py -ra
