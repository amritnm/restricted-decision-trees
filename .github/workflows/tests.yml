name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch / PR supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Caps OpenMP/BLAS threads (xgboost, numpy, scikit-learn). The library's own
  # pool ignores it: n_jobs=-1 resolves to std::thread::hardware_concurrency().
  OMP_NUM_THREADS: "2"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}${{ matrix.slow && ' (+slow)' || '' }}
    runs-on: ${{ matrix.os }}
    # Measured: ~1.5-2.5 min per job (build ~30 s, default suite ~35-55 s, slow ~40 s).
    timeout-minutes: ${{ matrix.slow && 30 || 20 }}
    defaults:
      run:
        shell: bash  # also on Windows (Git Bash), so every step reads the same
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
            slow: true
          - os: macos-latest
            python: "3.12"
          # aarch64 Linux: GCC with FMA available (see CMakeLists.txt).
          - os: ubuntu-24.04-arm
            python: "3.12"
          # MSVC: the release wheels include win_amd64.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and install from source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v .

      - name: Install libomp (macOS)
        # The macOS xgboost wheels link against Homebrew's libomp.dylib, which
        # the runner image does not ship.
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install test dependencies
        # xgboost >= 3.4 (needed by the parity tests) requires Python >= 3.12;
        # on older Pythons those tests skip via importorskip(minversion=...).
        # psutil: the memory tests read the peak working set with it on Windows.
        run: |
          python -m pip install pytest numpy scikit-learn "xgboost>=3.4; python_version >= '3.12'" \
            "psutil; sys_platform == 'win32'"
          python -m pip list
          python -c "import rdt, sys; print(rdt.__file__, sys.version)"

      - name: Check xgboost loads
        # Fail here rather than let the parity tests error at collection.
        if: matrix.python != '3.10'
        run: python -c "import xgboost; print('xgboost', xgboost.__version__)"

      - name: "TEMPORARY (to be reverted): memory-test measurements"
        if: runner.os == 'Windows'
        run: |
          cat > "$RUNNER_TEMP/mem_all.py" <<'PYEOF'
          # Runs every subprocess memory script in tests/ and prints growth vs the test's bound (MiB).
          import re, subprocess, sys, textwrap
          import importlib, os
          sys.path.insert(0, os.path.abspath("tests"))
          def script(path, name):
              return getattr(importlib.import_module(os.path.basename(path)[:-3]), name)
          def run(body, *args):
              return [int(v) for v in subprocess.run([sys.executable, "-c", body, *map(str, args)], capture_output=True, text=True, check=True).stdout.split()]
          M = 2**20
          for kind in ("gb", "rf"):
              g, xb = run(script("tests/test_performance_contracts.py", "_PREDICT_MEMORY_SCRIPT"), kind)
              print(f"predict_does_not_copy_X[{kind}]: growth {g/M:.1f} < bound {0.2*xb/M:.1f}")
          for kind, layout in (("gb", "f64C"), ("rf", "f32F")):
              g, xb = run(script("tests/test_hist.py", "_FIT_MEMORY_SCRIPT"), kind, layout)
              print(f"hist_fit_does_not_copy_X[{kind}-{layout}]: growth {g/M:.1f} < bound {(20000*1000 + 0.5*xb)/M:.1f}")
          g, xb = run(script("tests/test_hist.py", "_TALL_FIT_MEMORY_SCRIPT"))
          print(f"hist_binning_buffers_stay_small_on_tall_X: growth {g/M:.1f} < bound {(500000*64 + 0.75*xb)/M:.1f}")
          g, xb = run(script("tests/test_eval_set.py", "_EVAL_MEMORY_SCRIPT"))
          print(f"hist_float32_eval_set_is_not_copied: growth {g/M:.1f} < bound {0.25*xb/M:.1f}")
          d, b, u = (run(script("tests/test_hist_subtraction.py", "_CACHE_MEMORY_SCRIPT"), mb)[0] / M for mb in (0, 32, 4096))
          print(f"cache_budget_bounds_memory: direct {d:.1f} bounded {b:.1f} (< {d+48:.1f}) unbounded {u:.1f} (> {d+100:.1f})")
          d, b = (run(script("tests/test_hist_subtraction.py", "_MULTICLASS_MEMORY_SCRIPT"), mb)[0] / M for mb in (0, 64))
          print(f"multiclass_cache_budget: direct {d:.1f} bounded {b:.1f} (< {d+96:.1f})")
          PYEOF
          for i in 1 2; do python "$RUNNER_TEMP/mem_all.py"; done

      - name: Run tests
        run: python -m pytest tests -ra --durations=15

      - name: Run slow tests
        if: matrix.slow
        run: python -m pytest tests -m slow -ra --durations=15

  wheel-smoke-windows:
    # Builds one Windows wheel the way pypi-publish.yml does (same cibuildwheel
    # pin), installs it in a clean environment and runs a few tests against it.
    # Nothing is uploaded or published.
    name: cibuildwheel smoke (windows, cp312)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and test a wheel (not published)
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp312-win_amd64"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_REQUIRES: pytest numpy scikit-learn
          CIBW_TEST_COMMAND: pytest {project}/tests/test_rdt.py {project}/tests/test_ensemble.py -ra
